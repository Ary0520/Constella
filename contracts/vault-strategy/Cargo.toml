[package]
name = "constella-vault-strategy"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = { workspace = true }
# OpenZeppelin audited token modules (audit W4.2); v0.8.0 pins soroban-sdk 28.0.0.
stellar-tokens = "=0.8.0"

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
constella-registry = { path = "../registry" }
constella-policy = { path = "../policy" }
constella-nav-oracle = { path = "../nav-oracle" }
