[workspace]
resolver = "2"
members = [
    # Crate members will be added as each contract crate is scaffolded:
    # "shared",
    "registry",
    "policy",
    "nav-oracle",
    "vault-strategy",
    "smart-account",
    "fee-sponsor",
    "webauthn-verifier",
    "threshold-policy",
    "testkit",
    "vault-factory",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Constella Engineering Team"]
license = "Apache-2.0"

[workspace.dependencies]
soroban-sdk = "28.0.0"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[profile.release-with-logs]
inherits = "release"
debug-assertions = true
