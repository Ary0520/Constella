<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Constella sandbox</title>
  <style>
    :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
    body { max-width: 1100px; margin: 0 auto; padding: 16px; }
    .warn { background: #fff3cd; color: #5c4400; padding: 8px 12px; border-radius: 6px; }
    section { border: 1px solid #8884; border-radius: 8px; padding: 12px 16px; margin: 14px 0; }
    h2 { margin: 0 0 8px; font-size: 1.1rem; }
    table { border-collapse: collapse; width: 100%; font-size: .9rem; }
    td, th { border-bottom: 1px solid #8883; padding: 4px 6px; text-align: left; vertical-align: top; }
    pre { background: #8881; padding: 8px; overflow-x: auto; font-size: .8rem; max-height: 320px; }
    button { margin: 2px 4px 2px 0; } input, textarea, select { margin: 2px 4px 2px 0; }
    textarea { width: 100%; height: 70px; } .mono { font-family: ui-monospace, monospace; font-size: .8rem; word-break: break-all; }
    #log { max-height: 220px; }
  </style>
</head>
<body>
  <h1>Constella sandbox</h1>
  <p class="warn">Throwaway feature console for the LOCAL network only - not the product UI. Delete <code>sandbox/</code> to remove it.</p>
  <div id="app">Loading <code>/config.json</code> (run <code>localnet/up.sh</code> first)...</div>
  <section><h2>Activity log</h2><pre id="log"></pre></section>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
