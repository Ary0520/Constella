[project]
name = "constella-watchdog"
version = "0.1.0"
description = "Constella operations watchdog: checks balances, pauses, prices, claims and storage rent; alerts by email (decision D-M)."
requires-python = ">=3.11"
dependencies = [
    "stellar-sdk==17.0.1",
]

[project.optional-dependencies]
dev = ["pytest==8.3.3"]

[project.scripts]
constella-watchdog = "constella_watchdog.main:cli"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
